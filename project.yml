name: PapiersPro
options:
  bundleIdPrefix: com.papierspro
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: fr
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
targets:
  PapiersPro:
    type: application
    platform: iOS
    sources:
      - path: PapiersPro
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.papierspro.app
        PRODUCT_NAME: PapiersPro
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: PapiersPro
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "PapiersPro utilise vos photos uniquement pour importer le logo de votre entreprise."
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.business
        CODE_SIGN_STYLE: Automatic
    scheme:
      storeKitConfiguration: PapiersPro/Resources/PapiersPro.storekit
      testTargets:
        - PapiersProTests
  PapiersProTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PapiersProTests
    dependencies:
      - target: PapiersPro
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.papierspro.app.tests
